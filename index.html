    <meta name="language" content="Bulgarian" />

    <meta property="og:title" content="Патиланци — очаквайте скоро" />
    <meta
      property="og:description"
      content="Патиланци са българска общност за игри, видеа, стриймове и забавни приключения с приятели."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --color-bg: #0b0b0d;
        --color-surface: #151519;
        --color-cream: #f4e7cf;
        --color-red: #e53935;
        --color-gold: #f2b632;
        --color-muted: #a7a7ae;
        --color-white: #ffffff;
        --font-display: 'Oswald', 'Archivo Black', sans-serif;
        --font-body: 'Manrope', 'Inter', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-bg);
        color: var(--color-cream);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      ::selection {
        background: var(--color-red);
        color: var(--color-white);
      }

      a {
        color: inherit;
        transition: color 0.2s ease;
      }

      .page {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Background blobs + pixel accents, matching the main site's hero */
      .bg-fx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(70px);
      }

      .blob-a {
        top: -6rem;
        left: 8%;
        width: 24rem;
        height: 24rem;
        background: rgba(229, 57, 53, 0.25);
        animation: blob-drift-a 16s ease-in-out infinite;
      }

      .blob-b {
        top: 10%;
        right: 4%;
        width: 20rem;
        height: 20rem;
        background: rgba(242, 182, 50, 0.2);
        animation: blob-drift-b 20s ease-in-out infinite;
      }

      .glow-field {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(229, 57, 53, 0.1), transparent 45%),
          radial-gradient(circle at 85% 10%, rgba(242, 182, 50, 0.08), transparent 40%);
      }

      .pixel {
        position: absolute;
        border-radius: 3px;
        animation: pixel-bob 5s ease-in-out infinite;
      }

      .pixel-1 {
        top: 18%;
        left: 6%;
        width: 1rem;
        height: 1rem;
        background: rgba(242, 182, 50, 0.5);
        transform: rotate(12deg);
        animation-delay: 0.3s;
      }

      .pixel-2 {
        top: 65%;
        left: 12%;
        width: 0.75rem;
        height: 0.75rem;
        background: rgba(229, 57, 53, 0.5);
        transform: rotate(-6deg);
        animation-delay: 1.1s;
      }

      .pixel-3 {
        top: 26%;
        right: 10%;
        width: 0.9rem;
        height: 0.9rem;
        background: rgba(244, 231, 207, 0.3);
        transform: rotate(45deg);
        animation-delay: 0.7s;
      }

      @keyframes blob-drift-a {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(4%, 6%) scale(1.1);
        }
        66% {
          transform: translate(-3%, 3%) scale(0.95);
        }
      }

      @keyframes blob-drift-b {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(-5%, -4%) scale(0.9);
        }
        66% {
          transform: translate(3%, -6%) scale(1.08);
        }
      }

      @keyframes pixel-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      header {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: center;
        padding: 2rem 1.5rem 0;
      }

      header img {
        height: 7rem;
        width: auto;
      }

      @media (min-width: 640px) {
        header img {
          height: 9rem;
        }
      }

      main {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .content {
        max-width: 640px;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--color-surface);
        padding: 0.4rem 1rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(244, 231, 207, 0.8);
      }

      .badge .dot {
        position: relative;
        display: flex;
        height: 0.5rem;
        width: 0.5rem;
      }

      .badge .dot::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: rgba(229, 57, 53, 0.6);
        animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .badge .dot::after {
        content: '';
        position: relative;
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 9999px;
        background: var(--color-red);
      }

      @keyframes ping {
        75%,
        100% {
          transform: scale(2.4);
          opacity: 0;
        }
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.1;
        font-size: clamp(2.5rem, 7vw, 4.25rem);
        margin: 1.5rem 0 0;
      }

      h1 .accent {
        background: linear-gradient(90deg, var(--color-red), var(--color-gold), var(--color-red));
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradient-shift 4s ease-in-out infinite;
      }

      @keyframes gradient-shift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      p.lead {
        margin: 1.5rem auto 0;
        max-width: 460px;
        color: var(--color-muted);
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.6;
      }

      .notify {
        margin-top: 2.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .notify input[type='email'] {
        flex: 1 1 240px;
        max-width: 280px;
        padding: 0.9rem 1.1rem;
        border-radius: 0.75rem;
        border: 2px solid rgba(244, 231, 207, 0.15);
        background: var(--color-surface);
        color: var(--color-cream);
        font-family: var(--font-body);
        font-size: 0.9rem;
        outline: none;
      }

      .notify input[type='email']::placeholder {
        color: var(--color-muted);
      }

      .notify input[type='email']:focus {
        border-color: var(--color-gold);
      }

      .btn {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 0.75rem;
        font-family: var(--font-display);
        letter-spacing: 0.02em;
        font-size: 0.95rem;
        padding: 0.9rem 1.5rem;
        border: none;
        cursor: pointer;
        background: var(--color-red);
        color: var(--color-white);
        box-shadow: 0 4px 0 0 #9c1f1c;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 0 #9c1f1c;
      }

      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #9c1f1c;
      }

      .form-note {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: var(--color-muted);
      }

      .socials {
        margin-top: 2.75rem;
        display: flex;
        justify-content: center;
        gap: 0.75rem;
      }

      .socials a {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 2.75rem;
        width: 2.75rem;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--color-surface);
        color: rgba(244, 231, 207, 0.8);
      }

      .socials a:hover {
        border-color: rgba(242, 182, 50, 0.6);
        color: var(--color-gold);
      }

      .socials svg {
        height: 1.15rem;
        width: 1.15rem;
      }

      footer {
        position: relative;
        z-index: 10;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1.5rem;
        text-align: center;
        font-size: 0.75rem;
        color: var(--color-muted);
      }

      @media (prefers-reduced-motion: reduce) {
        .blob-a,
        .blob-b,
        .pixel,
        h1 .accent,
        .badge .dot::before {
          animation: none;
        }
      }
    </style>
  </head>
